<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tiendita de Calidad</title>
  <style>
    :root {
      --bg: #141214;
      --card-bg: #1c181b;
      --card-hover: #241e22;
      --border: #32282d;
      --border-accent: #7c2d37;
      --text-main: #e8e3e4;
      --text-muted: #9e8e93;
      --accent: #dc5665;
      --accent-soft: rgba(220, 86, 101, 0.12);
      --accent-border: rgba(220, 86, 101, 0.25);
      --accent-gold: #f59e0b;
      --accent-silver: #cbd5e1;
      --accent-bronze: #d97706;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-sans);
      padding: 1rem 0.75rem;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 1300px;
    }

    header {
      margin-bottom: 0.8rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .main-tabs {
      display: flex;
      gap: 0.4rem;
      align-items: center;
    }

    .main-tab-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      font-family: var(--font-sans);
      font-size: 0.88rem;
      font-weight: 600;
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      transition: all 0.15s ease;
    }

    .main-tab-btn:hover {
      color: var(--text-main);
      background: var(--card-bg);
    }

    .main-tab-btn.active {
      background: var(--card-bg);
      border-color: var(--border-accent);
      color: #faf5f6;
    }

    .count-tag {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-muted);
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
    }

    .nav-categories {
      position: sticky;
      top: 0;
      z-index: 20;
      background-color: rgba(20, 18, 20, 0.95);
      backdrop-filter: blur(6px);
      padding: 0.45rem 0;
      margin-bottom: 1rem;
      display: flex;
      gap: 0.4rem;
      overflow-x: auto;
      border-bottom: 1px solid rgba(50, 40, 45, 0.6);
      scrollbar-width: none;
    }

    .nav-categories::-webkit-scrollbar {
      display: none;
    }

    .cat-btn {
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--text-muted);
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 0.25rem 0.6rem;
      border-radius: 14px;
      text-decoration: none;
      white-space: nowrap;
      transition: color 0.15s ease, border-color 0.15s ease, background-color 0.15s ease;
    }

    .cat-btn:hover {
      color: var(--text-main);
      border-color: var(--border-accent);
      background: var(--card-hover);
    }

    .view-content {
      display: none;
    }

    .view-content.active {
      display: block;
    }

    .section-category {
      margin-bottom: 1.35rem;
      scroll-margin-top: 48px;
    }

    .category-header {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      margin-bottom: 0.55rem;
      padding-bottom: 0.25rem;
      border-bottom: 1px dashed var(--border);
    }

    .category-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: #faf5f6;
      letter-spacing: 0.02em;
    }

    .category-count {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      color: var(--text-muted);
    }

    /* Cuadrícula de tarjetas con mayor respiración */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 0.55rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 0.6rem 0.65rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 72px;
      transition: background-color 0.12s ease, border-color 0.12s ease;
    }

    .card:hover {
      background: var(--card-hover);
      border-color: var(--border-accent);
    }

    .product-name {
      font-size: 0.8rem;
      font-weight: 500;
      line-height: 1.25;
      color: var(--text-main);
      word-break: break-word;
      margin-bottom: 0.5rem;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.35rem;
    }

    /* Badge de stock destacado y minimalista */
    .stock-pill {
      display: inline-flex;
      align-items: baseline;
      gap: 0.15rem;
      font-family: var(--font-mono);
      font-size: 0.65rem;
      font-weight: 600;
      color: #fca5a5;
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      padding: 0.12rem 0.4rem;
      border-radius: 4px;
      line-height: 1;
    }

    .stock-unit {
      font-size: 0.58rem;
      opacity: 0.75;
      font-weight: 400;
    }

    .product-price {
      font-family: var(--font-mono);
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--accent);
    }

    /* Estructura del Leaderboard */
    .leaderboard-container {
      max-width: 550px;
      margin: 0.5rem 0 2rem 0;
    }

    .leaderboard-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 0.35rem;
      margin-top: 0.6rem;
      font-size: 0.82rem;
    }

    .leaderboard-table th {
      text-align: left;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      padding: 0.4rem 0.75rem;
    }

    .leaderboard-table tr {
      background: var(--card-bg);
      transition: background-color 0.15s ease;
    }

    .leaderboard-table tbody tr td {
      padding: 0.55rem 0.75rem;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .leaderboard-table tbody tr td:first-child {
      border-left: 1px solid var(--border);
      border-top-left-radius: 4px;
      border-bottom-left-radius: 4px;
    }

    .leaderboard-table tbody tr td:last-child {
      border-right: 1px solid var(--border);
      border-top-right-radius: 4px;
      border-bottom-right-radius: 4px;
    }

    .rank-cell {
      width: 50px;
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .leaderboard-name {
      font-weight: 500;
      color: var(--text-main);
    }

    .leaderboard-amount {
      text-align: right;
      font-family: var(--font-mono);
      font-weight: 700;
      color: var(--accent);
    }

    /* Estilos sutiles y distinguidos para el Top 3 */
    .row-top-1 {
      background: linear-gradient(90deg, rgba(245, 158, 11, 0.08) 0%, var(--card-bg) 100%) !important;
    }
    .row-top-1 td:first-child {
      border-left: 3px solid var(--accent-gold) !important;
    }
    .row-top-1 .rank-cell {
      color: var(--accent-gold);
    }

    .row-top-2 {
      background: linear-gradient(90deg, rgba(203, 213, 225, 0.07) 0%, var(--card-bg) 100%) !important;
    }
    .row-top-2 td:first-child {
      border-left: 3px solid var(--accent-silver) !important;
    }
    .row-top-2 .rank-cell {
      color: var(--accent-silver);
    }

    .row-top-3 {
      background: linear-gradient(90deg, rgba(217, 119, 6, 0.07) 0%, var(--card-bg) 100%) !important;
    }
    .row-top-3 td:first-child {
      border-left: 3px solid var(--accent-bronze) !important;
    }
    .row-top-3 .rank-cell {
      color: var(--accent-bronze);
    }

    .state-msg {
      text-align: center;
      padding: 2.5rem 1rem;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <nav class="main-tabs">
        <button id="btn-tab-catalogo" class="main-tab-btn active" onclick="cambiarPestana('catalogo')">
          Catálogo
        </button>
        <button id="btn-tab-leaderboard" class="main-tab-btn" onclick="cambiarPestana('leaderboard')">
          Leaderboard
        </button>
      </nav>
      <span id="contador-header" class="count-tag">-</span>
    </header>

    <div id="loading" class="state-msg">Cargando datos...</div>

    <!-- PESTAÑA 1: CATÁLOGO -->
    <main id="vista-catalogo" class="view-content active">
      <nav id="nav-categorias" class="nav-categories" style="display: none;"></nav>
      <div id="contenedor-categorias"></div>
      <div id="empty-catalogo" class="state-msg" style="display: none;">Sin productos disponibles.</div>
    </main>

    <!-- PESTAÑA 2: LEADERBOARD -->
    <main id="vista-leaderboard" class="view-content">
      <div class="leaderboard-container">
        <div class="category-header">
          <h2 class="category-title">Ranking de Clientes</h2>
          <span id="leaderboard-count" class="category-count">0 clientes</span>
        </div>
        <table class="leaderboard-table">
          <thead>
            <tr>
              <th class="rank-cell">#</th>
              <th>Nombre</th>
              <th style="text-align: right;">Consumo</th>
            </tr>
          </thead>
          <tbody id="leaderboard-body"></tbody>
        </table>
        <div id="empty-leaderboard" class="state-msg" style="display: none;">No hay registros de consumo aún.</div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script>
    const CSV_INVENTARIO_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTng6-nhK011yxjpHwNRUKvAufE1rRzDmwQB2qKA1UAASIPnV0rX3EzbDO5-ybS_v1OZoys-n9ynTmE/pub?gid=0&single=true&output=csv';
    const CSV_LEADERBOARD_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTng6-nhK011yxjpHwNRUKvAufE1rRzDmwQB2qKA1UAASIPnV0rX3EzbDO5-ybS_v1OZoys-n9ynTmE/pub?gid=2073725424&single=true&output=csv';

    let totalProductos = 0;
    let totalClientes = 0;

    function sanitizeId(text) {
      return 'cat-' + text.toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9]/g, '-');
    }

    function normalizarHeader(h) {
      return h.trim()
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '');
    }

    function parseConsumo(valorRaw) {
      if (!valorRaw) return 0;
      const str = String(valorRaw)
        .replace(/S\/\.?/gi, '')
        .replace(/[$€]/g, '')
        .replace(/\s+/g, '')
        .replace(',', '.');
      const num = parseFloat(str);
      return isNaN(num) ? 0 : num;
    }

    function cambiarPestana(pestana) {
      const btnCat = document.getElementById('btn-tab-catalogo');
      const btnLead = document.getElementById('btn-tab-leaderboard');
      const vistaCat = document.getElementById('vista-catalogo');
      const vistaLead = document.getElementById('vista-leaderboard');
      const contadorEl = document.getElementById('contador-header');

      if (pestana === 'catalogo') {
        btnCat.classList.add('active');
        btnLead.classList.remove('active');
        vistaCat.classList.add('active');
        vistaLead.classList.remove('active');
        contadorEl.textContent = `${totalProductos} items`;
      } else {
        btnLead.classList.add('active');
        btnCat.classList.remove('active');
        vistaLead.classList.add('active');
        vistaCat.classList.remove('active');
        contadorEl.textContent = `${totalClientes} clientes`;
      }
    }

    async function cargarCSV(url) {
      const resp = await fetch(url);
      const csv = await resp.text();
      return new Promise((resolve, reject) => {
        Papa.parse(csv, {
          header: true,
          skipEmptyLines: true,
          transformHeader: normalizarHeader,
          complete: results => resolve(results.data),
          error: reject
        });
      });
    }

    async function inicializar() {
      const loadingEl = document.getElementById('loading');
      const contadorEl = document.getElementById('contador-header');
      const navEl = document.getElementById('nav-categorias');
      const contenedorEl = document.getElementById('contenedor-categorias');
      const emptyCatalogo = document.getElementById('empty-catalogo');
      const leaderboardBody = document.getElementById('leaderboard-body');
      const leaderboardCount = document.getElementById('leaderboard-count');
      const emptyLeaderboard = document.getElementById('empty-leaderboard');

      try {
        const [inventarioData, leaderboardData] = await Promise.all([
          cargarCSV(CSV_INVENTARIO_URL),
          cargarCSV(CSV_LEADERBOARD_URL).catch(() => [])
        ]);

        loadingEl.style.display = 'none';

        // 1. Renderizado de Catálogo
        const itemsValidos = inventarioData.filter(fila => {
          const stock = parseInt(fila.stock || 0, 10);
          const nombre = (fila.nombre || '').trim();
          return !isNaN(stock) && stock > 0 && nombre.length > 0;
        });

        totalProductos = itemsValidos.length;
        contadorEl.textContent = `${totalProductos} items`;

        if (totalProductos === 0) {
          emptyCatalogo.style.display = 'block';
        } else {
          const categoriasMap = {};
          itemsValidos.forEach(item => {
            const catRaw = (item.categoria || '').trim();
            const categoria = catRaw.length > 0 ? catRaw : 'Otros';
            if (!categoriasMap[categoria]) categoriasMap[categoria] = [];
            categoriasMap[categoria].push(item);
          });

          const listaCategorias = Object.keys(categoriasMap);

          navEl.innerHTML = '';
          listaCategorias.forEach(cat => {
            const catId = sanitizeId(cat);
            const btn = document.createElement('a');
            btn.className = 'cat-btn';
            btn.href = `#${catId}`;
            btn.textContent = cat;
            navEl.appendChild(btn);
          });
          navEl.style.display = 'flex';

          contenedorEl.innerHTML = '';
          listaCategorias.forEach(cat => {
            const catId = sanitizeId(cat);
            const productos = categoriasMap[cat];

            const seccion = document.createElement('section');
            seccion.className = 'section-category';
            seccion.id = catId;
            seccion.innerHTML = `
              <div class="category-header">
                <h2 class="category-title">${cat}</h2>
                <span class="category-count">${productos.length}</span>
              </div>
              <div class="grid" id="grid-${catId}"></div>
            `;

            const grid = seccion.querySelector(`#grid-${catId}`);
            productos.forEach(prod => {
              const card = document.createElement('div');
              card.className = 'card';
              card.innerHTML = `
                <div class="product-name">${prod.nombre}</div>
                <div class="card-footer">
                  <span class="stock-pill">${prod.stock}<span class="stock-unit">u</span></span>
                  <span class="product-price">${prod.precio || '-'}</span>
                </div>
              `;
              grid.appendChild(card);
            });

            contenedorEl.appendChild(seccion);
          });
        }

        // 2. Renderizado de Leaderboard con empates y top 3 estilizado
        const ranking = (leaderboardData || [])
          .map(r => {
            const valRaw = r.consumo || r.precio || r.total || r.saldo || '';
            return {
              nombre: (r.nombre || '').trim(),
              consumo: parseConsumo(valRaw)
            };
          })
          .filter(r => r.nombre.length > 0)
          .sort((a, b) => b.consumo - a.consumo);

        totalClientes = ranking.length;
        leaderboardCount.textContent = `${totalClientes} clientes`;

        if (totalClientes === 0) {
          emptyLeaderboard.style.display = 'block';
        } else {
          leaderboardBody.innerHTML = '';

          let posicionActual = 1;
          let ultimoConsumo = null;

          ranking.forEach((entry, idx) => {
            // Lógica de empate: si tiene el mismo consumo, comparte la posición
            if (idx > 0 && entry.consumo === ultimoConsumo) {
              // Mantiene posicionActual
            } else {
              posicionActual = idx + 1;
            }
            ultimoConsumo = entry.consumo;

            let filaClase = '';
            if (posicionActual === 1) filaClase = 'row-top-1';
            else if (posicionActual === 2) filaClase = 'row-top-2';
            else if (posicionActual === 3) filaClase = 'row-top-3';

            const tr = document.createElement('tr');
            if (filaClase) tr.className = filaClase;

            tr.innerHTML = `
              <td class="rank-cell">#${posicionActual}</td>
              <td class="leaderboard-name">${entry.nombre}</td>
              <td class="leaderboard-amount">S/ ${entry.consumo.toFixed(2)}</td>
            `;
            leaderboardBody.appendChild(tr);
          });
        }

      } catch (err) {
        loadingEl.textContent = 'Error al cargar los datos.';
        console.error(err);
      }
    }

    inicializar();
  </script>
</body>
</html>
