<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo & Leaderboard</title>
  <style>
    :root {
      --bg: #141214;
      --card-bg: #1c181b;
      --card-hover: #241e22;
      --border: #32282d;
      --border-accent: #7c2d37;
      --text-main: #e8e3e4;
      --text-muted: #9e8e93;
      --accent: #dc5665;
      --accent-gold: #f59e0b;
      --accent-silver: #94a3b8;
      --accent-bronze: #d97706;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-sans);
      padding: 1rem 0.75rem;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 1300px;
    }

    header {
      margin-bottom: 0.6rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .status-indicator {
      width: 7px;
      height: 7px;
      background-color: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 5px var(--accent);
    }

    h1 {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: #faf5f6;
    }

    .count-tag {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-muted);
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
    }

    .nav-categories {
      position: sticky;
      top: 0;
      z-index: 20;
      background-color: rgba(20, 18, 20, 0.95);
      backdrop-filter: blur(6px);
      padding: 0.45rem 0;
      margin-bottom: 1rem;
      display: flex;
      gap: 0.4rem;
      overflow-x: auto;
      border-bottom: 1px solid rgba(50, 40, 45, 0.6);
      scrollbar-width: none;
    }

    .nav-categories::-webkit-scrollbar {
      display: none;
    }

    .cat-btn {
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--text-muted);
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 0.25rem 0.6rem;
      border-radius: 14px;
      text-decoration: none;
      white-space: nowrap;
      transition: color 0.15s ease, border-color 0.15s ease, background-color 0.15s ease;
    }

    .cat-btn:hover {
      color: var(--text-main);
      border-color: var(--border-accent);
      background: var(--card-hover);
    }

    .cat-btn.highlight {
      border-color: var(--border-accent);
      color: var(--accent);
    }

    .section-category {
      margin-bottom: 1.25rem;
      scroll-margin-top: 48px;
    }

    .category-header {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
      padding-bottom: 0.25rem;
      border-bottom: 1px dashed var(--border);
    }

    .category-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: #faf5f6;
      letter-spacing: 0.02em;
    }

    .category-count {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      color: var(--text-muted);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 0.45rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.5rem 0.6rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 64px;
      transition: background-color 0.12s ease, border-color 0.12s ease;
    }

    .card:hover {
      background: var(--card-hover);
      border-color: var(--border-accent);
    }

    .product-name {
      font-size: 0.78rem;
      font-weight: 500;
      line-height: 1.2;
      color: var(--text-main);
      word-break: break-word;
      margin-bottom: 0.35rem;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.3rem;
    }

    .product-stock {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .product-price {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent);
    }

    .leaderboard-section {
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      scroll-margin-top: 48px;
    }

    .leaderboard-table {
      width: 100%;
      max-width: 500px;
      border-collapse: collapse;
      margin-top: 0.5rem;
      font-size: 0.8rem;
    }

    .leaderboard-table th {
      text-align: left;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      padding: 0.4rem 0.6rem;
    }

    .leaderboard-table td {
      padding: 0.45rem 0.6rem;
      border-bottom: 1px solid rgba(50, 40, 45, 0.4);
    }

    .rank-cell {
      width: 45px;
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .rank-1 { color: var(--accent-gold); }
    .rank-2 { color: var(--accent-silver); }
    .rank-3 { color: var(--accent-bronze); }

    .leaderboard-name {
      font-weight: 500;
      color: var(--text-main);
    }

    .leaderboard-amount {
      text-align: right;
      font-family: var(--font-mono);
      font-weight: 700;
      color: var(--accent);
    }

    .state-msg {
      text-align: center;
      padding: 2.5rem 1rem;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="title-group">
        <span class="status-indicator"></span>
        <h1>Catálogo</h1>
      </div>
      <span id="contador" class="count-tag">-</span>
    </header>

    <nav id="nav-categorias" class="nav-categories" style="display: none;"></nav>

    <div id="loading" class="state-msg">Cargando...</div>
    <div id="contenedor-categorias"></div>
    <div id="empty" class="state-msg" style="display: none;">Sin productos disponibles.</div>

    <section id="leaderboard" class="leaderboard-section" style="display: none;">
      <div class="category-header">
        <h2 class="category-title">Leaderboard Clientes</h2>
        <span id="leaderboard-count" class="category-count"></span>
      </div>
      <table class="leaderboard-table">
        <thead>
          <tr>
            <th class="rank-cell">#</th>
            <th>Nombre</th>
            <th style="text-align: right;">Consumo</th>
          </tr>
        </thead>
        <tbody id="leaderboard-body"></tbody>
      </table>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script>
    const CSV_INVENTARIO_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTng6-nhK011yxjpHwNRUKvAufE1rRzDmwQB2qKA1UAASIPnV0rX3EzbDO5-ybS_v1OZoys-n9ynTmE/pub?gid=0&single=true&output=csv';
    const CSV_LEADERBOARD_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTng6-nhK011yxjpHwNRUKvAufE1rRzDmwQB2qKA1UAASIPnV0rX3EzbDO5-ybS_v1OZoys-n9ynTmE/pub?gid=2073725424&single=true&output=csv';

    function sanitizeId(text) {
      return 'cat-' + text.toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9]/g, '-');
    }

    function normalizarHeader(h) {
      return h.trim()
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '');
    }

    async function cargarInventario() {
      const resp = await fetch(CSV_INVENTARIO_URL);
      const csv = await resp.text();
      return new Promise((resolve, reject) => {
        Papa.parse(csv, {
          header: true,
          skipEmptyLines: true,
          transformHeader: normalizarHeader,
          complete: results => resolve(results.data),
          error: reject
        });
      });
    }

    async function cargarLeaderboard() {
      try {
        const resp = await fetch(CSV_LEADERBOARD_URL);
        if (!resp.ok) return [];
        const csv = await resp.text();
        return new Promise((resolve) => {
          Papa.parse(csv, {
            header: true,
            skipEmptyLines: true,
            transformHeader: normalizarHeader,
            complete: results => resolve(results.data),
            error: () => resolve([])
          });
        });
      } catch (e) {
        return [];
      }
    }

    async function inicializar() {
      const loadingEl = document.getElementById('loading');
      const emptyEl = document.getElementById('empty');
      const contadorEl = document.getElementById('contador');
      const navEl = document.getElementById('nav-categorias');
      const contenedorEl = document.getElementById('contenedor-categorias');
      const leaderboardSec = document.getElementById('leaderboard');
      const leaderboardBody = document.getElementById('leaderboard-body');
      const leaderboardCount = document.getElementById('leaderboard-count');

      try {
        const [inventarioData, leaderboardData] = await Promise.all([
          cargarInventario(),
          cargarLeaderboard()
        ]);

        loadingEl.style.display = 'none';

        // 1. Renderizado de Inventario
        const itemsValidos = inventarioData.filter(fila => {
          const stock = parseInt(fila.stock || 0, 10);
          const nombre = (fila.nombre || '').trim();
          return !isNaN(stock) && stock > 0 && nombre.length > 0;
        });

        contadorEl.textContent = `${itemsValidos.length}`;

        if (itemsValidos.length === 0) {
          emptyEl.style.display = 'block';
        } else {
          const categoriasMap = {};
          itemsValidos.forEach(item => {
            const catRaw = (item.categoria || '').trim();
            const categoria = catRaw.length > 0 ? catRaw : 'Otros';
            if (!categoriasMap[categoria]) categoriasMap[categoria] = [];
            categoriasMap[categoria].push(item);
          });

          const listaCategorias = Object.keys(categoriasMap);

          navEl.innerHTML = '';
          listaCategorias.forEach(cat => {
            const catId = sanitizeId(cat);
            const btn = document.createElement('a');
            btn.className = 'cat-btn';
            btn.href = `#${catId}`;
            btn.textContent = cat;
            navEl.appendChild(btn);
          });

          contenedorEl.innerHTML = '';
          listaCategorias.forEach(cat => {
            const catId = sanitizeId(cat);
            const productos = categoriasMap[cat];

            const seccion = document.createElement('section');
            seccion.className = 'section-category';
            seccion.id = catId;

            seccion.innerHTML = `
              <div class="category-header">
                <h2 class="category-title">${cat}</h2>
                <span class="category-count">${productos.length}</span>
              </div>
              <div class="grid" id="grid-${catId}"></div>
            `;

            const grid = seccion.querySelector(`#grid-${catId}`);
            productos.forEach(prod => {
              const card = document.createElement('div');
              card.className = 'card';
              card.innerHTML = `
                <div class="product-name">${prod.nombre}</div>
                <div class="card-footer">
                  <span class="product-stock">${prod.stock}u</span>
                  <span class="product-price">${prod.precio || '-'}</span>
                </div>
              `;
              grid.appendChild(card);
            });

            contenedorEl.appendChild(seccion);
          });
        }

        // 2. Renderizado de Leaderboard
        const ranking = leaderboardData
          .map(r => ({
            nombre: (r.nombre || '').trim(),
            consumo: parseFloat(r.consumo || 0)
          }))
          .filter(r => r.nombre.length > 0)
          .sort((a, b) => b.consumo - a.consumo);

        if (ranking.length > 0) {
          leaderboardBody.innerHTML = '';
          ranking.forEach((entry, idx) => {
            const rank = idx + 1;
            const rankClass = rank === 1 ? 'rank-1' : rank === 2 ? 'rank-2' : rank === 3 ? 'rank-3' : '';
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td class="rank-cell ${rankClass}">#${rank}</td>
              <td class="leaderboard-name">${entry.nombre}</td>
              <td class="leaderboard-amount">S/ ${entry.consumo.toFixed(2)}</td>
            `;
            leaderboardBody.appendChild(tr);
          });

          leaderboardCount.textContent = `${ranking.length} clientes`;
          leaderboardSec.style.display = 'block';

          const btnLeaderboard = document.createElement('a');
          btnLeaderboard.className = 'cat-btn highlight';
          btnLeaderboard.href = '#leaderboard';
          btnLeaderboard.textContent = '★ Leaderboard';
          navEl.appendChild(btnLeaderboard);
        }

        if (navEl.children.length > 0) {
          navEl.style.display = 'flex';
        }

      } catch (err) {
        loadingEl.textContent = 'Error al cargar los datos.';
        console.error(err);
      }
    }

    inicializar();
  </script>
</body>
</html>
