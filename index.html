<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo</title>
  <style>
    :root {
      --bg: #141214;
      --card-bg: #1c181b;
      --card-hover: #241e22;
      --border: #32282d;
      --border-accent: #6b262f;
      --text-main: #e8e3e4;
      --text-muted: #9e8e93;
      --accent: #dc5665;
      --accent-badge: #42161b;
      --accent-badge-text: #fca5a5;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-sans);
      padding: 1.25rem 1rem;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 1200px;
    }

    header {
      margin-bottom: 1.25rem;
      padding-bottom: 0.6rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .status-indicator {
      width: 8px;
      height: 8px;
      background-color: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--accent);
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #faf5f6;
    }

    .count-tag {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-muted);
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
    }

    /* Cuadrícula compacta de alta densidad */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 0.65rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 0.7rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 90px;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .card:hover {
      background: var(--card-hover);
      border-color: var(--border-accent);
    }

    .badge {
      display: inline-block;
      align-self: flex-start;
      font-family: var(--font-mono);
      font-size: 0.62rem;
      font-weight: 600;
      color: var(--accent-badge-text);
      background: var(--accent-badge);
      border: 1px solid rgba(220, 86, 101, 0.3);
      padding: 0.1rem 0.35rem;
      border-radius: 3px;
      margin-bottom: 0.45rem;
      letter-spacing: 0.02em;
    }

    .product-name {
      font-size: 0.85rem;
      font-weight: 500;
      line-height: 1.25;
      color: var(--text-main);
      word-break: break-word;
      margin-bottom: 0.5rem;
    }

    .card-footer {
      display: flex;
      justify-content: flex-end;
      align-items: baseline;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
      padding-top: 0.4rem;
    }

    .product-price {
      font-family: var(--font-mono);
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--accent);
    }

    .state-msg {
      text-align: center;
      padding: 3rem 1rem;
      font-family: var(--font-mono);
      font-size: 0.82rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="title-group">
        <span class="status-indicator"></span>
        <h1>Catálogo</h1>
      </div>
      <span id="contador" class="count-tag">-</span>
    </header>

    <div id="loading" class="state-msg">Cargando...</div>
    <div id="lista" class="grid"></div>
    <div id="empty" class="state-msg" style="display: none;">Sin productos disponibles en este momento.</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTng6-nhK011yxjpHwNRUKvAufE1rRzDmwQB2qKA1UAASIPnV0rX3EzbDO5-ybS_v1OZoys-n9ynTmE/pub?gid=0&single=true&output=csv';

    async function cargarCatalogo() {
      const loadingEl = document.getElementById('loading');
      const listaEl = document.getElementById('lista');
      const emptyEl = document.getElementById('empty');
      const contadorEl = document.getElementById('contador');

      try {
        const respuesta = await fetch(CSV_URL);
        const csvTexto = await respuesta.text();

        Papa.parse(csvTexto, {
          header: true,
          skipEmptyLines: true,
          complete: function(results) {
            loadingEl.style.display = 'none';

            // Filtrado: únicamente productos con stock > 0
            const itemsValidos = results.data.filter(fila => {
              const stock = parseInt(fila.Stock || fila.stock || 0, 10);
              const nombre = (fila.Nombre || fila.nombre || '').trim();
              return !isNaN(stock) && stock > 0 && nombre.length > 0;
            });

            contadorEl.textContent = `${itemsValidos.length} items`;

            if (itemsValidos.length === 0) {
              emptyEl.style.display = 'block';
              return;
            }

            listaEl.innerHTML = '';
            itemsValidos.forEach(prod => {
              const nombre = prod.Nombre || prod.nombre;
              const precio = prod.Precio || prod.precio || '-';

              const card = document.createElement('div');
              card.className = 'card';
              card.innerHTML = `
                <div>
                  <span class="badge">Disponible</span>
                  <div class="product-name">${nombre}</div>
                </div>
                <div class="card-footer">
                  <span class="product-price">${precio}</span>
                </div>
              `;
              listaEl.appendChild(card);
            });
          },
          error: function(err) {
            loadingEl.textContent = 'Error al leer los datos.';
            console.error(err);
          }
        });
      } catch (error) {
        loadingEl.textContent = 'Error de conexión con la hoja.';
        console.error(error);
      }
    }

    cargarCatalogo();
  </script>
</body>
</html>
