<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo</title>
  <style>
    :root {
      --bg: #141214;
      --card-bg: #1c181b;
      --card-hover: #241e22;
      --border: #32282d;
      --border-accent: #7c2d37;
      --text-main: #e8e3e4;
      --text-muted: #9e8e93;
      --accent: #dc5665;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-sans);
      padding: 1rem 0.75rem;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 1300px;
    }

    header {
      margin-bottom: 0.6rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .status-indicator {
      width: 7px;
      height: 7px;
      background-color: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 5px var(--accent);
    }

    h1 {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: #faf5f6;
    }

    .count-tag {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-muted);
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
    }

    /* Barra fija de categorías */
    .nav-categories {
      position: sticky;
      top: 0;
      z-index: 20;
      background-color: rgba(20, 18, 20, 0.95);
      backdrop-filter: blur(6px);
      padding: 0.45rem 0;
      margin-bottom: 1rem;
      display: flex;
      gap: 0.4rem;
      overflow-x: auto;
      border-bottom: 1px solid rgba(50, 40, 45, 0.6);
      scrollbar-width: none;
    }

    .nav-categories::-webkit-scrollbar {
      display: none;
    }

    .cat-btn {
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--text-muted);
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 0.25rem 0.6rem;
      border-radius: 14px;
      text-decoration: none;
      white-space: nowrap;
      transition: color 0.15s ease, border-color 0.15s ease, background-color 0.15s ease;
    }

    .cat-btn:hover {
      color: var(--text-main);
      border-color: var(--border-accent);
      background: var(--card-hover);
    }

    /* Secciones por categoría */
    .section-category {
      margin-bottom: 1.25rem;
      scroll-margin-top: 45px;
    }

    .category-header {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
      padding-bottom: 0.25rem;
      border-bottom: 1px dashed var(--border);
    }

    .category-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: #faf5f6;
      letter-spacing: 0.02em;
    }

    .category-count {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      color: var(--text-muted);
    }

    /* Cuadrícula ultra densa */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 0.45rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.5rem 0.6rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 64px;
      transition: background-color 0.12s ease, border-color 0.12s ease;
    }

    .card:hover {
      background: var(--card-hover);
      border-color: var(--border-accent);
    }

    .product-name {
      font-size: 0.78rem;
      font-weight: 500;
      line-height: 1.2;
      color: var(--text-main);
      word-break: break-word;
      margin-bottom: 0.35rem;
    }

    .card-footer {
      display: flex;
      justify-content: flex-end;
      align-items: baseline;
    }

    .product-price {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent);
    }

    .state-msg {
      text-align: center;
      padding: 2.5rem 1rem;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="title-group">
        <span class="status-indicator"></span>
        <h1>Catálogo</h1>
      </div>
      <span id="contador" class="count-tag">-</span>
    </header>

    <!-- Barra de salto rápido entre categorías -->
    <nav id="nav-categorias" class="nav-categories" style="display: none;"></nav>

    <div id="loading" class="state-msg">Cargando...</div>
    <div id="contenedor-categorias"></div>
    <div id="empty" class="state-msg" style="display: none;">Sin productos disponibles.</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTng6-nhK011yxjpHwNRUKvAufE1rRzDmwQB2qKA1UAASIPnV0rX3EzbDO5-ybS_v1OZoys-n9ynTmE/pub?gid=0&single=true&output=csv';

    async function cargarCatalogo() {
      const loadingEl = document.getElementById('loading');
      const emptyEl = document.getElementById('empty');
      const contadorEl = document.getElementById('contador');
      const navEl = document.getElementById('nav-categorias');
      const contenedorEl = document.getElementById('contenedor-categorias');

      try {
        const respuesta = await fetch(CSV_URL);
        const csvTexto = await respuesta.text();

        Papa.parse(csvTexto, {
          header: true,
          skipEmptyLines: true,
          complete: function(results) {
            loadingEl.style.display = 'none';

            // Filtrar solo productos con stock > 0 y nombre válido
            const itemsValidos = results.data.filter(fila => {
              const stock = parseInt(fila.Stock || fila.stock || 0, 10);
              const nombre = (fila.Nombre || fila.nombre || '').trim();
              return !isNaN(stock) && stock > 0 && nombre.length > 0;
            });

            contadorEl.textContent = `${itemsValidos.length}`;

            if (itemsValidos.length === 0) {
              emptyEl.style.display = 'block';
              return;
            }

            // Agrupar productos por la columna Categoria
            const categoriasMap = {};
            itemsValidos.forEach(item => {
              const catRaw = (item.Categoria || item.categoria || '').trim();
              const categoria = catRaw.length > 0 ? catRaw : 'Varios';

              if (!categoriasMap[categoria]) {
                categoriasMap[categoria] = [];
              }
              categoriasMap[categoria].push(item);
            });

            const listaCategorias = Object.keys(categoriasMap);

            // Renderizar navegación rápida
            navEl.innerHTML = '';
            listaCategorias.forEach(cat => {
              const catId = 'cat-' + encodeURIComponent(cat.toLowerCase().replace(/\s+/g, '-'));
              const btn = document.createElement('a');
              btn.className = 'cat-btn';
              btn.href = `#${catId}`;
              btn.textContent = cat;
              navEl.appendChild(btn);
            });
            navEl.style.display = 'flex';

            // Renderizar secciones por categoría y sus tarjetas
            contenedorEl.innerHTML = '';
            listaCategorias.forEach(cat => {
              const catId = 'cat-' + encodeURIComponent(cat.toLowerCase().replace(/\s+/g, '-'));
              const productos = categoriasMap[cat];

              const seccion = document.createElement('section');
              seccion.className = 'section-category';
              seccion.id = catId;

              seccion.innerHTML = `
                <div class="category-header">
                  <h2 class="category-title">${cat}</h2>
                  <span class="category-count">${productos.length}</span>
                </div>
                <div class="grid" id="grid-${catId}"></div>
              `;

              const grid = seccion.querySelector(`#grid-${CSS.escape(catId)}`);
              productos.forEach(prod => {
                const nombre = prod.Nombre || prod.nombre;
                const precio = prod.Precio || prod.precio || '-';

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                  <div class="product-name">${nombre}</div>
                  <div class="card-footer">
                    <span class="product-price">${precio}</span>
                  </div>
                `;
                grid.appendChild(card);
              });

              contenedorEl.appendChild(seccion);
            });
          },
          error: function(err) {
            loadingEl.textContent = 'Error al leer datos.';
            console.error(err);
          }
        });
      } catch (error) {
        loadingEl.textContent = 'Error de conexión.';
        console.error(error);
      }
    }

    cargarCatalogo();
  </script>
</body>
</html>
